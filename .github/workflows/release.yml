name: Release builds

# Manual only: builds the installable desktop apps and a debug Android APK
# from the current commit and attaches them to the run as artifacts.
# Store-ready builds additionally need signing — see docs/shipping.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Install (game)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Build (game, relative URLs)
        run: npm run build:native
      - name: Install (shell)
        working-directory: desktop
        run: npm ci
      - name: Package
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  # The Play Store bundle. Signed when the upload keystore is configured as
  # secrets (see docs/play-store.md); unsigned otherwise.
  android:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install (game)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Build (game, relative URLs)
        run: npm run build:native
      - name: Install (shell)
        working-directory: mobile
        run: npm ci
      - name: Copy the game into the Android project
        working-directory: mobile
        run: npx cap sync android
      - name: Restore the upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the release bundle (.aab)
        working-directory: mobile/android
        env:
          LUMENWILD_KEYSTORE: ${{ steps.keystore.outputs.path }}
          LUMENWILD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMENWILD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMENWILD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
