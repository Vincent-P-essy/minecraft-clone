  <polygon points="132,222 228,275 228,381 132,328" fill="#ffd27a"/>
  <polygon points="284,275 380,222 380,328 284,381" fill="#ffab45"/>
  <g stroke="#343a4b" stroke-width="12">
    <line x1="180" y1="248" x2="180" y2="355"/>
    <line x1="132" y1="275" x2="228" y2="328"/>
  </g>
  <g stroke="#1f2330" stroke-width="12">
