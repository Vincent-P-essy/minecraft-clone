      <stop offset="1" stop-color="#090e18"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc45a" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#ff9a3c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
